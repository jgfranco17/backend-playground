---
name: "Setup Development Workspace"
description: "Configure Python and prepare the workspace"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Sync dependencies
      shell: bash
      run: |
        uv --version
        uv sync

    - name: Install Just
      uses: extractions/setup-just@v2
