name: Testing

"on":
  push:
    branches:
      - "**"

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run unit test cases
        run: |
          just pytest -vv

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run setup
        uses: ./.github/actions/setup-workspace

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Build image
        run: |
          just build

      - name: Start service container
        run: |
          just up &
          sleep 10

      - name: Run integration test cases
        run: |
          just pytest -vv -x -m "integration" --with-integration

      - name: Stop container
        run: |
          just down
