name: Testing

"on":
  push:
    branches:
      - "**"

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run setup
        uses: ./.github/actions/setup-workspace

      - name: Run Pytest
        run: |
          just pytest -vv

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run setup
        uses: ./.github/actions/setup-workspace

      - name: Build image
        run: |
          just build

      - name: Start API container
        run: |
          just up &
          sleep 10

      - name: Run Pytest with Integration Tests
        run: |
          just pytest -vv -x -m "integration" --with-integration
