[project]
name = "backend-playground"
version = "0.1.0"
description = "Virtual playground for backend learning"
authors = [{ name = "Chino Franco", email = "chino.franco@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.8,<0.116",
    "uvicorn>=0.34.0,<0.35",
    "sqlalchemy>=2.0.38,<3",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.14.1,<2",
    "pydantic-settings>=2.7.1,<3",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.6,<10",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0,<26",
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.25.3,<0.26",
    "httpx>=0.28.1,<0.29",
    "isort>=6.0.0,<7",
    "flake8>=7.1.1,<8",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[tool.black]
line-length = 90

[tool.isort]
profile = "black"
line_length = 90

[tool.ruff]
target-version = "py312"
line-length = 88
